<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        main {
            width: 1200px;
            height: auto;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 120px 600px 80px;
            gap: 10px;
        }

        #logo,
        #section,
        footer {
            background-color: bisque;
        }

        #section {
            display: grid;
            grid-template-columns: 1fr 3fr;
            grid-template-rows: 1fr;
            gap: 10px;
        }

        #left,
        #right {
            background-color: rgb(92, 226, 43);
        }
        #right{
            display: grid;
            grid-template-columns: 1fr 3fr;
            grid-template-rows: 1fr 3fr;
            gap: 10px;

        }
        #r_top,#r_btm{
            background-color:#999;

        }
    </style>
</head>

<body>
    <main>
        <div id="logo">
            <h2>LOGO</h2>
        </div>
        <div id="section">
            <div id="left">
                <h2>SIDEBAR NAVIGATION</h2>
            </div>
            <div id="right">
                <h2>RIGHT</h2>
                
                <div id="r_top"><h2>HEADER/Banner</h2></div>
                <div id="r_btm"><h2>Body Area</h2></div>
            </div>
            
        </div>
        <footer>
            <h2>FOOTER</h2>
        </footer>
    </main>


</body>

</html>
